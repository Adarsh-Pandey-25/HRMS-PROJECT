### SpaxSync security response headers ###
#
# Install to: /etc/nginx/snippets/spaxsync-security-headers.conf
#
# Why a snippet and not inline in hrms.conf: nginx's `add_header` is NOT
# additive across levels — a `location` block that sets ANY add_header stops
# inheriting every add_header from its server block. Nearly every location in
# hrms.conf sets its own Cache-Control, so server-level security headers alone
# would silently vanish on exactly the HTML responses that need them. Every
# such location therefore `include`s this file explicitly.
#
# `always` sends these on error responses (404/500) too, not just 2xx/3xx.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# camera=(self) is REQUIRED — selfie check-in calls getUserMedia().
# geolocation=(self) is REQUIRED — GPS geofence check-in and the
# "use current location" geofence-setup control.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;

# 1 year, and includeSubDomains covers every {tenant}.spaxsync.com.
# Browsers cache this, so it is effectively irreversible for max-age —
# only keep includeSubDomains while the wildcard cert stays valid.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy. Each non-obvious source is required by a real
# feature in this app — removing one breaks that feature:
#
#   script-src  www.youtube.com, s.ytimg.com
#               Training/Courses injects YouTube's IFrame API at runtime
#               (components/training/YouTubeAntiSkipPlayer.jsx) and that API
#               then pulls its widget bundle from s.ytimg.com.
#   frame-src   www.youtube.com, www.youtube-nocookie.com
#               the YouTube player iframe itself. Without this it falls back
#               to default-src 'self' and every course video is blocked.
#   img-src     blob:  — selfie capture preview (URL.createObjectURL)
#               data:  — inline SVG/icons and the 2FA QR code data URI
#               https: — Supabase signed storage URLs (profile photos,
#                        selfies) and YouTube thumbnails
#   media-src   blob:/https: — uploaded course videos via signed URLs
#   style-src   'unsafe-inline' — Tailwind/React inline styles
#   connect-src https://*.supabase.co — signed-URL fetches; the API itself is
#               same-origin (/api) because VITE_API_URL is left unset in prod
#   worker-src  'self' — /sw.js
#   static.cloudflareinsights.com
#               Cloudflare injects its Web Analytics beacon into every HTML
#               response at the edge; without this the browser blocks it and
#               logs a CSP error on every page load. cloudflareinsights.com is
#               where that beacon POSTs, hence connect-src too.
#
# 'unsafe-inline' in script-src is a real weakening; it is here because the
# Vite build emits an inline module preload shim. Removing it needs a nonce
# injected at response time — worth doing later, not at launch.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cloudflareinsights.com https://static.cloudflareinsights.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
