# /etc/nginx/sites-available/hrms — SpaxSync (spaxsync.com + *.spaxsync.com)
#
# TLS on :443 is terminated by the stream SNI router (/etc/nginx/stream.d/tls-sni.conf),
# which hands spaxsync.com, api.spaxsync.com and *.spaxsync.com to 127.0.0.1:8443 with
# PROXY protocol. NEVER add "listen 443" here — it breaks every other site on this box.
# Apply with:  sudo nginx -t && sudo systemctl reload nginx   (never stop/restart/kill nginx)

# ── 1. Apex: marketing site + /super-admin + /onboarding ─────────────────────────────
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name spaxsync.com api.spaxsync.com;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/letsencrypt/live/spaxsync.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spaxsync.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/ubuntu/hrms/HRMS/dist;
    client_max_body_size 10M;

    # Pre-rendered marketing pages 404 here instead of falling back to the SPA.
    error_page 404 /_marketing/404.html;

    # API, biometric push (ADMS) and health check → backend
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location ^~ /iclock {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /health {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Hashed build output — cache forever
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Kill-switch service worker for old PWA installs — must never be cached
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Pre-rendered files are served only through the rules below, never by their own URL
    location ^~ /_marketing/ {
        internal;
        add_header Cache-Control "no-cache";
    }
    location = /robots.txt  { try_files /_marketing/robots.txt =404; }
    location = /sitemap.xml { try_files /_marketing/sitemap.xml =404; }

    # SPA template — only reachable via the fallbacks below
    location = /index.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # HRMS app screens that live on the apex
    location ^~ /super-admin {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
    location ^~ /onboarding {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Everything else: a pre-rendered page, a public file (favicon, og-image…), or the 404 page
    location / {
        add_header Cache-Control "no-cache";
        try_files /_marketing${uri}/index.html /_marketing${uri}index.html $uri =404;
    }
}

# ── 2. www → apex ─────────────────────────────────────────────────────────────────────
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name www.spaxsync.com;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/letsencrypt/live/spaxsync.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spaxsync.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://spaxsync.com$request_uri;
}

# ── 3. Company workspaces: {slug}.spaxsync.com ────────────────────────────────────────
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name *.spaxsync.com;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/letsencrypt/live/spaxsync.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spaxsync.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/ubuntu/hrms/HRMS/dist;
    client_max_body_size 10M;

    # Workspaces are private — keep them out of search engines.
    # (add_header in a location replaces these, so locations repeat it.)
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        add_header X-Robots-Tag "noindex, nofollow" always;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location ^~ /iclock {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /health {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Platform-only screens and marketing files don't exist on workspaces
    location ^~ /super-admin { return 404; }
    location ^~ /onboarding  { return 404; }
    location ^~ /_marketing/ { return 404; }
    location = /sitemap.xml  { return 404; }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # The HRMS app: / (employee login), /admin, /hr, /employee-onboarding, /dashboard…
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }
}

# ── 4. Plain HTTP → HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name spaxsync.com www.spaxsync.com api.spaxsync.com *.spaxsync.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
